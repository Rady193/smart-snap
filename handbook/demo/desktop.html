<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>A sample desktop</title>
<!-- A made-up desktop for the handbook's pictures of choosing an area: two browser windows showing the sample site
     (index.html, orders.html) over a plain wallpaper. Never a real desktop. 1600 x 900. -->
<style>
  *{box-sizing:border-box} html,body{margin:0;width:1600px;height:900px;overflow:hidden;font:13px/1.4 "Segoe UI",system-ui,sans-serif}
  body{background:radial-gradient(1200px 700px at 78% 18%,#6b3b96 0%,#3a1f55 45%,#1e1230 100%)}
  .win{position:absolute;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.25)}
  .bar{height:38px;background:#ece9f2;display:flex;align-items:flex-end;padding:0 10px;gap:6px}
  .tab{height:30px;padding:0 14px;background:#fff;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:8px;font-size:12px;color:#17141c}
  .tab i{width:12px;height:12px;border-radius:3px;background:#5b2c83}
  .ctl{margin-left:auto;align-self:center;display:flex;gap:18px;color:#6a6175;font-size:13px;padding-right:4px}
  .addr{height:38px;background:#fff;border-bottom:1px solid #e3dfe8;display:flex;align-items:center;gap:10px;padding:0 12px;color:#6a6175}
  .addr span{flex:1;height:26px;border-radius:13px;background:#f3f1f6;display:flex;align-items:center;padding:0 12px;color:#17141c}
  iframe{border:0;width:100%;display:block}
  .task{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(18,12,26,.92);display:flex;align-items:center;justify-content:center;gap:12px}
  .task b{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.14)} .task b.on{background:#5b2c83}
  .task .clock{position:absolute;right:16px;color:#eceef3;font-size:12px;text-align:right;line-height:1.3}
</style></head>
<body>
<div class="win" style="left:70px;top:150px;width:860px;height:560px">
  <div class="bar"><div class="tab"><i></i>Orders · Sample site</div><div class="ctl"><span>–</span><span>□</span><span>✕</span></div></div>
  <div class="addr">‹ › ⟳<span>localhost:3000/orders.html</span></div>
  <iframe src="orders.html" style="height:484px"></iframe>
</div>
<div class="win" style="left:560px;top:70px;width:960px;height:700px">
  <div class="bar"><div class="tab"><i></i>Sample site</div><div class="ctl"><span>–</span><span>□</span><span>✕</span></div></div>
  <div class="addr">‹ › ⟳<span>localhost:3000</span></div>
  <iframe src="index.html" style="height:624px"></iframe>
</div>
<div class="task"><b></b><b class="on"></b><b></b><b></b><b></b><div class="clock">10:42<br>16/11/2026</div></div>
</body></html>
