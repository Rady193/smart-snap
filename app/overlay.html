<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Smart Snap selection</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  /* The live screen shows through. The faint tint keeps the mouse on this
     window where nothing is drawn. */
  html.live { background: rgba(0, 0, 0, .004); }
  html.live body { background: transparent; }
  html.live #shot { display: none; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; display: block; -webkit-user-drag: none; pointer-events: none; }
  /* The dimming is drawn around the chosen box by four strips. */
  .dim { position: fixed; background: rgba(8, 10, 16, .45); pointer-events: none; }
  #box { position: fixed; display: none; outline: 2px solid #f0c33c; box-shadow: 0 0 0 1px rgba(255, 255, 255, .55) inset; pointer-events: none; }
  #box.window { outline-color: #f0c33c; }
  #size { position: fixed; display: none; padding: 3px 7px; color: #fff; background: rgba(20, 22, 30, .88); border-radius: 6px; font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; white-space: nowrap; max-width: 60vw; overflow: hidden; text-overflow: ellipsis; }
  #hint { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); display: flex; gap: 14px; padding: 8px 14px; color: #eceef3; background: rgba(20, 22, 30, .9); border: 1px solid rgba(255, 255, 255, .12); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); pointer-events: none; transition: opacity .15s; }
  #hint b { color: #fff; font-weight: 600; }
  #hint kbd { padding: 0 5px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 4px; font: inherit; font-size: 11px; }
  body.dragging #hint { opacity: 0; }

  /* The comment box beside the chosen area, in Smart Snap's own colours. */
  :root {
    --surface: #191a1b; --field: #121314; --line: #333536; --text: #cccccc; --dim: #8c8c8c;
    --focus: #f0c33c; --primary: #5b2c83; --primary-hover: #45215f; --soft: rgba(91, 44, 131, .3); --button: #202122; --button-hover: #2a2b2c;
  }
  :root[data-theme="light"] {
    --surface: #ffffff; --field: #f6f5f8; --line: #d4d0dc; --text: #17141c; --dim: #6a6175;
    --focus: #5b2c83; --soft: rgba(91, 44, 131, .1); --button: #f6f5f8; --button-hover: #eceaf0;
  }
  body.commenting, body.commenting * { cursor: default; }
  body.commenting #hint, body.commenting #size { display: none !important; }
  #card { position: fixed; z-index: 5; width: 330px; display: flex; flex-direction: column; gap: 8px; padding: 12px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: text; box-sizing: border-box; }
  #card[hidden] { display: none; }
  #card .head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  #card .head b { flex: none; font-weight: 600; }
  #card .head span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  #card textarea { width: 100%; min-height: 84px; max-height: 240px; padding: 8px 10px; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 8px; font: inherit; line-height: 1.45; resize: vertical; box-sizing: border-box; cursor: text; }
  #card textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px var(--soft); }
  #card textarea::placeholder { color: var(--dim); }
  #card .keys { color: var(--dim); font-size: 12px; }
  #card .row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
  #card button { height: 28px; padding: 0 10px; color: var(--text); background: var(--button); border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; }
  #card button:hover { background: var(--button-hover); }
  #card button.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
  #card button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  #card button:disabled { opacity: .5; cursor: default; }

  /* Recording a video: the area outlined in red, the outside dimmed lightly, the
     bar beside it. None of it is in the video (Windows leaves this window out). */
  body.chosen, body.chosen * { cursor: default; }
  body.chosen #hint, body.chosen #size { display: none !important; }
  body.recording .dim { background: rgba(8, 10, 16, .22); }
  #box.rec { outline-color: #e5484d; box-shadow: none; }
  #count { position: fixed; z-index: 5; display: none; place-items: center; width: 96px; height: 96px; margin: -48px 0 0 -48px; color: #fff;
    background: rgba(20, 22, 30, .78); border-radius: 50%; font: 600 46px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; pointer-events: none; }
  body.counting #count { display: grid; }
  #bar { position: fixed; z-index: 6; display: flex; align-items: center; padding: 8px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5); white-space: nowrap;
    font: 13px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #bar[hidden] { display: none; }
  #bar .part { display: none; align-items: center; gap: 6px; }
  #bar[data-stage="ready"] .ready, #bar[data-stage="starting"] .starting,
  #bar[data-stage="recording"] .live, #bar[data-stage="paused"] .live { display: flex; }
  #bar button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; color: var(--text); background: var(--button);
    border: 1px solid var(--line); border-radius: 8px; font: inherit; font-weight: 500; white-space: nowrap; cursor: pointer; }
  #bar button:hover { background: var(--button-hover); }
  #bar button.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
  #bar button.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
  #bar button.toggle[aria-pressed="true"] { color: var(--focus); background: var(--soft); border-color: var(--focus); }
  #bar button.armed { color: #fff; background: #c4373c; border-color: #c4373c; }
  #bar svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #bar .rec-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #e5484d; }
  #bar button .rec-dot { box-shadow: 0 0 0 2px rgba(255, 255, 255, .85); }
  #bar[data-stage="paused"] .live > .rec-dot { background: transparent; box-shadow: inset 0 0 0 2px var(--dim); }
  #bar .sep { width: 1px; height: 20px; margin: 0 3px; background: var(--line); }
  #r-time { min-width: 46px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #r-sound { display: flex; gap: 5px; color: var(--dim); }
  #r-sound svg { width: 15px; height: 15px; }
  #r-sound .off { color: #e5484d; }
  #r-wait { min-width: 150px; color: var(--dim); }
  #bar .keys { margin-left: 4px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<img id="shot" alt="" draggable="false">
<div class="dim" id="d-top"></div><div class="dim" id="d-left"></div><div class="dim" id="d-right"></div><div class="dim" id="d-bottom"></div>
<div id="box"></div>
<div id="size"></div>
<div id="hint"><span><b>Drag</b> to snap an area</span><span><b>Click</b> a window to snap it</span><span><kbd>Esc</kbd> cancel</span></div>
<form id="card" hidden autocomplete="off">
  <div class="head"><b id="c-title">Snap</b><span id="c-app"></span></div>
  <textarea id="c-text" rows="4" spellcheck="true" placeholder="Describe what you see here…"></textarea>
  <div class="keys">Enter saves and copies it as a picture<br>Shift+Enter new line · Esc discards the snap</div>
  <div class="row">
    <button type="button" id="c-discard" title="Throw this snap away">Discard</button>
    <button type="button" id="c-open" title="Save, then open Smart Snap to mark a spot or area on the picture">Save and open</button>
    <button type="submit" id="c-save" class="primary" title="Save the snap with this comment and copy it as a picture, to paste into a chat, an email or a document (Enter)">Save</button>
  </div>
</form>
<div id="count"></div>
<div id="bar" hidden>
  <div class="part ready">
    <button type="button" id="r-start" class="primary" title="Start recording after a three-second count (Enter)"><span class="rec-dot"></span>Start recording</button>
    <button type="button" id="r-system" class="toggle" aria-pressed="false" title="Also record the sound the computer plays"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"/><path d="M15 9.2a4 4 0 0 1 0 5.6M17.6 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>Computer sound</button>
    <button type="button" id="r-mic" class="toggle" aria-pressed="false" title="Also record your voice, through the microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg>Microphone</button>
    <button type="button" id="r-cancel" title="Record nothing (Esc)">Cancel</button>
  </div>
  <div class="part starting">
    <span id="r-wait">Recording starts in 3</span>
    <button type="button" id="r-cancel-2" title="Record nothing (Esc)">Cancel</button>
  </div>
  <div class="part live">
    <span class="rec-dot"></span><span id="r-time">0:00</span><span id="r-sound"></span>
    <span class="sep"></span>
    <button type="button" id="r-pause" title="Pause the recording; Resume goes on in the same video"><svg viewBox="0 0 24 24"><path d="M9 6.5v11M15 6.5v11"/></svg><span>Pause</span></button>
    <button type="button" id="r-stop" class="primary" title="Stop and save the video, then write its comment (Ctrl + Alt + R)"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>Stop</button>
    <button type="button" id="r-discard" title="Stop and throw the video away"><span>Discard</span></button>
  </div>
</div>
<script>
(() => {
  const shot = document.getElementById('shot');
  const box = document.getElementById('box');
  const size = document.getElementById('size');
  const dims = ['top', 'left', 'right', 'bottom'].map((k) => document.getElementById('d-' + k));
  let windows = [];
  let start = null;
  let current = null;
  let finished = false;
  let scale = devicePixelRatio;
  let last = null;
  let chosen = null;
  let purpose = 'snap';     // or "record", for a video
  const ratio = () => (shot.naturalWidth ? shot.naturalWidth / innerWidth : scale);

  // Dims everything outside rectangle r (or the whole screen when r is null).
  function draw(r, kind, label) {
    const W = innerWidth, H = innerHeight;
    if (!r) {
      Object.assign(dims[0].style, { left: 0, top: 0, width: W + 'px', height: H + 'px' });
      for (const d of dims.slice(1)) d.style.width = '0';
      box.style.display = 'none'; size.style.display = 'none';
      return;
    }
    Object.assign(dims[0].style, { left: 0, top: 0, width: W + 'px', height: Math.max(0, r.y) + 'px' });
    Object.assign(dims[3].style, { left: 0, top: (r.y + r.h) + 'px', width: W + 'px', height: Math.max(0, H - r.y - r.h) + 'px' });
    Object.assign(dims[1].style, { left: 0, top: r.y + 'px', width: Math.max(0, r.x) + 'px', height: r.h + 'px' });
    Object.assign(dims[2].style, { left: (r.x + r.w) + 'px', top: r.y + 'px', width: Math.max(0, W - r.x - r.w) + 'px', height: r.h + 'px' });
    Object.assign(box.style, { display: 'block', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    box.className = kind;
    size.textContent = label;
    size.style.display = 'block';
    const below = r.y + r.h + 8;
    size.style.left = Math.min(Math.max(4, r.x), W - size.offsetWidth - 4) + 'px';
    size.style.top = (below + 26 < H ? below : Math.max(4, r.y - 30)) + 'px';
    if (r.y < 4 && r.h > H - 40) size.style.top = '60px';
  }

  const clip = (w) => {
    const x = Math.max(0, w.x), y = Math.max(0, w.y);
    return { x, y, w: Math.min(innerWidth, w.x + w.w) - x, h: Math.min(innerHeight, w.y + w.h) - y, hwnd: w.hwnd, title: w.title };
  };
  const windowAt = (x, y) => {
    const w = windows.find((w) => x >= w.x && y >= w.y && x < w.x + w.w && y < w.y + w.h);
    return w ? clip(w) : null;
  };
  const px = (r) => `${Math.round(r.w * ratio())} × ${Math.round(r.h * ratio())}`;

  function hover(e) {
    current = windowAt(e.clientX, e.clientY);
    if (current) draw(current, 'window', (current.title ? current.title + ' · ' : '') + px(current));
    else draw(null);
  }

  function finish(result) {
    if (finished) return;
    finished = true;
    start = null;
    document.body.classList.remove('dragging');
    // The chosen area stays outlined while its picture is taken and its comment
    // written, or while its video is recorded.
    if (result) {
      chosen = { x: result.x, y: result.y, w: result.w, h: result.h };
      document.body.classList.add('chosen');
      if (purpose === 'snap') document.body.classList.add('commenting');
      draw(chosen, 'window', '');
    }
    window.overlay.done(result);
  }

  const shown = () => {
    draw(null);
    if (last) hover(last);
    requestAnimationFrame(() => requestAnimationFrame(() => window.overlay.ready()));
  };
  window.overlay.onImage((data) => {
    windows = data.windows || [];
    if (data.scale) scale = data.scale;
    if (data.theme) document.documentElement.dataset.theme = data.theme;
    if (data.purpose === 'record') {
      purpose = 'record';
      document.getElementById('hint').innerHTML = '<span><b>Drag</b> to record an area</span><span><b>Click</b> a window to record it</span><span><kbd>Enter</kbd> the whole screen</span><span><kbd>Esc</kbd> cancel</span>';
    }
    if (!data.src) {
      document.documentElement.classList.add('live');
      return shown();
    }
    shot.onload = shown;
    shot.src = data.src;
  });
  // On the live screen the window outlines come a moment later.
  if (window.overlay.onWindows) {
    window.overlay.onWindows((list) => {
      windows = list || [];
      if (last && !start && !finished) hover(last);
    });
  }

  // Press, drag, release. The pointer stays with this window until it is
  // released, even outside it; nothing on the page can be dragged away.
  addEventListener('dragstart', (e) => e.preventDefault());
  addEventListener('pointerdown', (e) => {
    if (finished) return;
    if (e.button === 2) return finish(null);
    if (e.button !== 0) return;
    try { document.documentElement.setPointerCapture(e.pointerId); } catch { /* still works inside the window */ }
    start = { x: e.clientX, y: e.clientY };
  });

  addEventListener('pointermove', (e) => {
    if (finished) return;
    last = { clientX: e.clientX, clientY: e.clientY };
    if (!start) return hover(e);
    const x = Math.min(innerWidth, Math.max(0, e.clientX)), y = Math.min(innerHeight, Math.max(0, e.clientY));
    const dx = x - start.x, dy = y - start.y;
    if (Math.abs(dx) < 3 && Math.abs(dy) < 3 && !document.body.classList.contains('dragging')) return;
    document.body.classList.add('dragging');
    current = { x: Math.min(start.x, x), y: Math.min(start.y, y), w: Math.abs(dx), h: Math.abs(dy) };
    draw(current, '', px(current));
  });

  addEventListener('pointerup', (e) => {
    if (finished || e.button !== 0 || !start) return;
    const dragging = document.body.classList.contains('dragging');
    start = null;
    document.body.classList.remove('dragging');
    if (dragging) {
      if (current && current.w >= 3 && current.h >= 3) finish({ x: current.x, y: current.y, w: current.w, h: current.h });
      else draw(null);
      return;
    }
    // A click takes the window under the mouse, or the whole display.
    const w = windowAt(e.clientX, e.clientY);
    finish(w ? { x: w.x, y: w.y, w: w.w, h: w.h, hwnd: w.hwnd } : { x: 0, y: 0, w: innerWidth, h: innerHeight });
  });

  addEventListener('pointercancel', () => {
    if (finished) return;
    start = null;
    document.body.classList.remove('dragging');
    draw(null);
  });

  addEventListener('keydown', (e) => {
    if (asking) {
      if (e.key === 'Escape') answer('discard');
      // Enter saves; Shift+Enter starts a new line.
      else if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); answer('save'); }
      return;
    }
    if (finished) return;
    if (e.key === 'Escape') finish(null);
    if (e.key === 'Enter') finish({ x: 0, y: 0, w: innerWidth, h: innerHeight });
  });

  // ---- The comment, in a box beside the chosen area ----------------------------
  const card = document.getElementById('card');
  const text = document.getElementById('c-text');
  let asking = false;

  // Right of the area, else left of it, below or above it; else inside its corner.
  function placeCard(r) {
    const W = innerWidth, H = innerHeight, gap = 12, m = 8;
    const cw = card.offsetWidth, ch = card.offsetHeight;
    const clampX = (x) => Math.min(W - cw - m, Math.max(m, x));
    const clampY = (y) => Math.min(H - ch - m, Math.max(m, y));
    let x, y;
    if (r.x + r.w + gap + cw <= W - m) { x = r.x + r.w + gap; y = clampY(r.y); }
    else if (r.x - gap - cw >= m) { x = r.x - gap - cw; y = clampY(r.y); }
    else if (r.y + r.h + gap + ch <= H - m) { x = clampX(r.x + r.w - cw); y = r.y + r.h + gap; }
    else if (r.y - gap - ch >= m) { x = clampX(r.x + r.w - cw); y = r.y - gap - ch; }
    else { x = clampX(r.x + r.w - cw - 16); y = clampY(r.y + r.h - ch - 16); }
    card.style.left = x + 'px';
    card.style.top = y + 'px';
  }

  function answer(action) {
    if (!asking) return;
    asking = false;
    for (const b of card.querySelectorAll('button')) b.disabled = true;
    window.overlay.commentDone({ action, text: text.value });
  }

  if (window.overlay.onComment) {
    window.overlay.onComment((data) => {
      const r = data.area || chosen || { x: 0, y: 0, w: innerWidth, h: innerHeight };
      document.getElementById('c-title').textContent = `Snap ${data.number}`;
      if (data.video) videoComment(data.number);
      document.body.classList.add('commenting');
      draw(r, 'window', '');
      card.hidden = false;
      placeCard(r);
      asking = true;
      text.focus();
    });
    window.overlay.onApp((name) => { document.getElementById('c-app').textContent = name ? '· ' + name : ''; });
  }
  card.addEventListener('submit', (e) => { e.preventDefault(); answer('save'); });
  document.getElementById('c-discard').onclick = () => answer('discard');
  document.getElementById('c-open').onclick = () => answer('open');
  // A click outside the box leaves the typing where it was.
  addEventListener('mousedown', (e) => { if (asking && !card.contains(e.target)) { e.preventDefault(); text.focus(); } });
  addEventListener('contextmenu', (e) => e.preventDefault());

  // ---- Recording a video: the bar beside the area ------------------------------
  // main.js says what to show (`stage`): ready (Start, the sounds, Cancel),
  // starting (the count), recording or paused (the time, Pause, Stop, Discard).
  // While it starts and records, this window lets the mouse through to the
  // programs underneath, and takes it back over the bar.
  const bar = document.getElementById('bar');
  const count = document.getElementById('count');
  const sound = { system: false, mic: false };
  let stage = '';
  let area = null;
  let runningSince = 0;     // while recording, when the time last started running
  let before = 0;           // the time recorded before the last pause, in ms
  let ticking = 0;
  let overBar = false;
  const ICON_SYSTEM = '<path d="M4 9.5h3.2L11.5 6v12l-4.3-3.5H4z"/><path d="M15 9.2a4 4 0 0 1 0 5.6M17.6 6.6a7.6 7.6 0 0 1 0 10.8"/>';
  const ICON_MIC = '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/>';

  const elapsed = () => before + (runningSince ? performance.now() - runningSince : 0);
  const clock = (ms) => {
    const s = Math.floor(ms / 1000);
    const p = (n) => String(n).padStart(2, '0');
    return s >= 3600 ? `${Math.floor(s / 3600)}:${p(Math.floor((s % 3600) / 60))}:${p(s % 60)}` : `${Math.floor(s / 60)}:${p(s % 60)}`;
  };
  const showTime = () => { document.getElementById('r-time').textContent = clock(elapsed()); };

  // Below the area, else above it, else inside it along its foot; never off the screen.
  function placeBar() {
    if (!area) return;
    const W = innerWidth, H = innerHeight, gap = 10, m = 8;
    const bw = bar.offsetWidth, bh = bar.offsetHeight;
    const x = Math.min(W - bw - m, Math.max(m, area.x + area.w / 2 - bw / 2));
    let y;
    if (area.y + area.h + gap + bh <= H - m) y = area.y + area.h + gap;
    else if (area.y - gap - bh >= m) y = area.y - gap - bh;
    else y = Math.min(H - bh - m, Math.max(m, area.y + area.h - bh - 16));
    bar.style.left = x + 'px';
    bar.style.top = y + 'px';
  }

  function showSoundChoice() {
    document.getElementById('r-system').setAttribute('aria-pressed', String(sound.system));
    document.getElementById('r-mic').setAttribute('aria-pressed', String(sound.mic));
  }

  // While recording: which sounds are in the video; one asked for that could not be had, crossed out in red.
  function showSoundTaken(s) {
    const icon = (paths, on, missing, title) => (on || missing
      ? `<svg viewBox="0 0 24 24" class="${on ? '' : 'off'}"><title>${title}</title>${paths}${on ? '' : '<path d="M4 4l16 16"/>'}</svg>` : '');
    document.getElementById('r-sound').innerHTML =
      icon(ICON_SYSTEM, s.system, s.systemMissing, s.system ? 'Recording the computer\'s sound' : 'The computer\'s sound could not be recorded')
      + icon(ICON_MIC, s.mic, s.micMissing, s.mic ? 'Recording the microphone' : 'The microphone could not be used: Windows may keep it from desktop apps (Settings > Privacy & security > Microphone)');
  }

  function setStage(next) {
    stage = next;
    bar.dataset.stage = next;
    bar.hidden = false;
    document.body.classList.toggle('recording', next !== 'ready');
    document.body.classList.toggle('counting', next === 'starting');
    draw(area, next === 'ready' ? 'window' : 'rec', '');
    placeBar();
  }

  function countDown(ms) {
    count.style.left = (area.x + area.w / 2) + 'px';
    count.style.top = (area.y + area.h / 2) + 'px';
    const wait = document.getElementById('r-wait');
    const steps = Math.round(ms / 1000);
    for (let i = 0; i < steps; i++) {
      setTimeout(() => {
        if (stage !== 'starting') return;
        count.textContent = String(steps - i);
        wait.textContent = `Recording starts in ${steps - i}`;
      }, i * 1000);
    }
    setTimeout(() => { if (stage === 'starting') { count.textContent = ''; wait.textContent = 'Starting…'; } }, steps * 1000);
    placeBar();
  }

  if (window.overlay.onRecord) {
    window.overlay.onRecord((state) => {
      if (state.press === 'start') { if (stage === 'ready') window.overlay.record('start', sound); return; }
      if (state.area) area = state.area;
      if (!area) area = chosen || { x: 0, y: 0, w: innerWidth, h: innerHeight };
      if (state.stage === 'ready') {
        if (state.sound) { sound.system = !!state.sound.system; sound.mic = !!state.sound.mic; }
        showSoundChoice();
        setStage('ready');
      } else if (state.stage === 'starting') {
        setStage('starting');
        countDown(state.countdown || 3000);
      } else if (state.stage === 'recording') {
        if (state.sound) showSoundTaken(state.sound);
        if (!runningSince) runningSince = performance.now();
        document.querySelector('#r-pause span').textContent = 'Pause';
        document.getElementById('r-pause').title = 'Pause the recording; Resume goes on in the same video';
        setStage('recording');
        showTime();
        clearInterval(ticking);
        ticking = setInterval(showTime, 250);
      } else if (state.stage === 'paused') {
        if (runningSince) { before += performance.now() - runningSince; runningSince = 0; }
        clearInterval(ticking);
        showTime();
        document.querySelector('#r-pause span').textContent = 'Resume';
        document.getElementById('r-pause').title = 'Go on recording, in the same video';
        setStage('paused');
      }
    });
  }

  // Over the bar the mouse is this window's; elsewhere it goes through.
  addEventListener('mousemove', (e) => {
    if (!['starting', 'recording', 'paused'].includes(stage) || bar.hidden) return;
    const r = bar.getBoundingClientRect();
    const over = e.clientX >= r.left - 4 && e.clientX <= r.right + 4 && e.clientY >= r.top - 4 && e.clientY <= r.bottom + 4;
    if (over !== overBar) { overBar = over; window.overlay.pointer(over); }
  });

  const toggle = (key) => { sound[key] = !sound[key]; showSoundChoice(); };
  document.getElementById('r-system').onclick = () => toggle('system');
  document.getElementById('r-mic').onclick = () => toggle('mic');
  document.getElementById('r-start').onclick = () => { if (stage === 'ready') window.overlay.record('start', sound); };
  document.getElementById('r-cancel').onclick = () => window.overlay.record('cancel');
  document.getElementById('r-cancel-2').onclick = () => window.overlay.record('cancel');
  document.getElementById('r-pause').onclick = () => window.overlay.record(stage === 'paused' ? 'resume' : 'pause');
  document.getElementById('r-stop').onclick = () => window.overlay.record('stop');
  // Discard asks once more: a second click within three seconds.
  const discard = document.getElementById('r-discard');
  let armed = 0;
  discard.onclick = () => {
    if (armed) { clearTimeout(armed); armed = 0; window.overlay.record('discard'); return; }
    discard.classList.add('armed');
    discard.firstChild.textContent = 'Discard the video?';
    placeBar();
    armed = setTimeout(() => {
      armed = 0;
      discard.classList.remove('armed');
      discard.firstChild.textContent = 'Discard';
      placeBar();
    }, 3000);
  };

  // After Stop, the comment box is for the video.
  function videoComment(number) {
    if (runningSince) { before += performance.now() - runningSince; runningSince = 0; }
    clearInterval(ticking);
    stage = 'comment';
    bar.hidden = true;
    document.body.classList.remove('recording', 'counting');
    document.getElementById('c-title').textContent = `Video ${number} · ${clock(before)}`;
    document.querySelector('#card .keys').innerHTML = 'Enter saves it and copies the video file<br>Shift+Enter new line · Esc discards the video';
    text.placeholder = 'Describe what happens here…';
    document.getElementById('c-save').title = 'Save the video with this comment and copy its file, to paste into a chat, an email or a folder (Enter)';
    document.getElementById('c-open').title = 'Save, then open Smart Snap on the video';
    document.getElementById('c-discard').title = 'Throw this video away (its file goes to the Recycle Bin)';
  }
})();
</script>
</body>
</html>
